services:
  app:
    build:
      context: .
      dockerfile: resources/docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ${PROJECT_PREFIX:-rest-api}-app
    hostname: ${PROJECT_PREFIX:-rest-api}-app
    working_dir: /app
    volumes:
      - .:/app
      - fpm-socket:/run/php
    env_file: .env
    environment:
      PHP_IDE_CONFIG: serverName=${PROJECT_PREFIX:-rest-api}-app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_PREFIX:-rest-api}-nginx
    hostname: ${PROJECT_PREFIX:-rest-api}-nginx
    ports:
      # The container always listens on 8080; the host port is configurable
      # so several projects can run side by side.
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/app:ro
      - ./resources/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./resources/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - fpm-socket:/run/php
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/fpm-ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: mariadb:10.6
    container_name: ${PROJECT_PREFIX:-rest-api}-db
    hostname: ${PROJECT_PREFIX:-rest-api}-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:-secret}
      MARIADB_DATABASE: ${DB_NAME:-phalcon}
    # No host port published: the app reaches the database over the internal
    # compose network. Not exposed to the host by design.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  cache:
    image: redis:8-alpine
    container_name: ${PROJECT_PREFIX:-rest-api}-cache
    hostname: ${PROJECT_PREFIX:-rest-api}-cache

volumes:
  fpm-socket:
