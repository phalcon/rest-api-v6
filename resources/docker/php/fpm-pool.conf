[global]
error_log = /dev/stderr
daemonize = no

[www]
user  = phalcon
group = phalcon

; Unix socket on the shared volume. Same kernel as nginx, so this stays
; faster than the loopback TCP it replaces. 0666 because the nginx image
; runs its workers as a different user.
listen       = /run/php/fpm.sock
listen.owner = phalcon
listen.group = phalcon
listen.mode  = 0666

; static: no fork on a cold request, no idle-timeout churn. The previous
; `ondemand` with max_children=100 paid a fork per cold hit and described
; a worker count (100 x 256M) that could never actually be reached.
pm                   = static
pm.max_children      = 8
pm.max_requests      = 5000
pm.status_path       = /fpm-status
ping.path            = /fpm-ping

catch_workers_output    = yes
decorate_workers_output = no
clear_env               = no
