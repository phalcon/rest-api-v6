[PHP]
date.timezone           = UTC
memory_limit            = 256M
max_execution_time      = 30
max_input_time          = 30
error_reporting         = E_ALL
display_errors          = On
display_startup_errors  = On
log_errors              = On
html_errors             = Off
expose_php              = Off

; Resolved-path cache: a framework app stats a lot of files.
realpath_cache_size     = 4096K
realpath_cache_ttl      = 600

[opcache]
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000

; Development: the code is bind-mounted, so timestamps must be checked.
; Production flips validate_timestamps to 0 and adds opcache.preload.
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 0

; JIT does nothing for I/O-bound request handling and costs memory.
opcache.jit                     = disable
opcache.jit_buffer_size         = 0
