server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root /app/public;

    absolute_redirect    off;
    client_max_body_size 1m;

    limit_req  zone=api burst=20 nodelay;
    limit_conn apiconn 20;

    # A throttled client must not suddenly receive HTML from an API.
    error_page 429 = @throttled;
    location @throttled {
        default_type application/json;
        return 429 '{"data":[],"errors":["Too Many Requests"],"meta":{"code":429,"message":"error"}}';
    }

    location ~ /\. {
        deny          all;
        access_log    off;
        log_not_found off;
    }

    location = /fpm-ping {
        include       fastcgi_params;
        fastcgi_pass  php;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location = /fpm-status {
        include       fastcgi_params;
        fastcgi_pass  php;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    # Single front controller: every other request goes to index.php.
    location / {
        include       fastcgi_params;
        fastcgi_pass  php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;

        fastcgi_keep_conn    on;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size  32k;
        fastcgi_buffers      16 16k;
    }
}
