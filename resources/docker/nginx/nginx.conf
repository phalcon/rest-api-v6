worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/json;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    server_tokens     off;
    keepalive_timeout 65;

    fastcgi_hide_header X-Powered-By;

    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          '$request_time $upstream_response_time';

    # Health and FPM probes are polled constantly; keep them out of the log.
    map $request_uri $loggable {
        ~^/(health|fpm-ping|fpm-status)$ 0;
        default                          1;
    }

    access_log /dev/stdout main_timed if=$loggable;
    error_log  /dev/stderr warn;

    # JSON only, and never for payloads small enough that compression loses.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json application/problem+json
                    application/vnd.api+json text/plain;

    # Throttling. 10 r/s sustained per client with a burst of 20, and at most
    # 20 concurrent connections per client. 429 rather than nginx's default 503.
    limit_req_zone    $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone   $binary_remote_addr zone=apiconn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream php {
        server unix:/run/php/fpm.sock;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
