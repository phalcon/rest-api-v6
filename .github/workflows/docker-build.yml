name: "Docker build"

on:
  push:
    paths:
      - 'resources/docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'resources/docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build (PHP ${{ matrix.php }})"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: "Build the application image"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: resources/docker/Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          push: false
          load: true
          tags: rest-api-v6:${{ matrix.php }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Verify extensions (opcache and pcov present, xdebug absent)"
        run: |
          docker run --rm rest-api-v6:${{ matrix.php }} php -m > modules.txt
          grep -qi 'Zend OPcache' modules.txt
          grep -qi 'pcov' modules.txt
          if grep -qi 'xdebug' modules.txt; then
            echo "xdebug must not be installed"
            exit 1
          fi
